services:
  sim:
    image: ghost-racer-sitl:local
    platform: linux/amd64
    pull_policy: never
    init: true
    working_dir: /workspace
    command: ["/usr/bin/python3", "-u", "sim/bridge/server.py"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - .:/workspace:ro
    environment:
      GZ_SIM_RESOURCE_PATH: /workspace/sim/models:/home/devpod/aeroloop_gazebo/models
      SDF_PATH: /workspace/sim/models:/home/devpod/aeroloop_gazebo/models
      GZ_SIM_SYSTEM_PLUGIN_PATH: /home/devpod/aeroloop_gazebo/plugins/build
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      PYTHONDONTWRITEBYTECODE: "1"
    shm_size: 256mb
    logging:
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 5s
      timeout: 3s
      start_period: 150s
      retries: 3
  trainer:
    build: ./learning
    init: true
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      BRIDGE_URL: http://sim:8765
    volumes:
      - .:/workspace:ro
      - ./runs:/workspace/runs
    depends_on:
      sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8766/api/runs', timeout=2)"]
      interval: 5s
      timeout: 4s
      retries: 5
